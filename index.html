<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Team Tenacity Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout idea: aubergine header with tabs; announcements first, then what's next, then a two-column grid of cards that stacks on phones. */
:root{
  color-scheme: light;
  --ink:#1E1530; --ink-2:#4A3F5E; --ink-3:#5C516F;
  --ground:#F6F3FA; --card:#FFFFFF; --line:#E2D9EF; --line-2:#ECE6F4; --soft:#F3F0F7;
  --plum:#2A1548; --purple:#5B2A9D; --purple-dark:#3A1470; --lilac:#E4D7F7; --lilac-text:#D9C8F5;
  --pink:#FBE1EE; --pink-text:#8A1F55;
  --warn-bg:#FFF4E0; --warn:#8A4B00; --warn-2:#6B4A12; --ok:#1F5E3A; --ok-bg:#E3F3E9;
  --display:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --body:Inter, 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--ground);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--purple)}a:hover{color:var(--purple-dark)}
:focus-visible{outline:3px solid #9B6BE0;outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
ul{list-style:none;margin:0;padding:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}

header.top{background:var(--plum);color:#fff}
.top-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:8px}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.brand span{font-size:13px;color:var(--lilac-text);margin-left:10px}
.who{font-size:13px;color:var(--lilac-text);overflow-wrap:anywhere}
.tabs{display:flex;gap:4px}
.tabs a{color:var(--lilac-text);text-decoration:none;font-size:15px;font-weight:500;padding:12px 14px;min-height:44px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:#fff;font-weight:600;border-bottom-color:#C9A8FF}
.preview{background:var(--warn-bg);color:var(--warn-2);font-size:13px;padding:8px 0}
.preview .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.preview label{font-weight:600}
.preview select{font-family:inherit;font-size:16px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid #B98A3A;background:#fff;color:var(--ink);max-width:100%}

main{display:flex;flex-direction:column;gap:20px;padding-top:28px;padding-bottom:56px}
.view[hidden]{display:none}
.view{display:flex;flex-direction:column;gap:20px}
.hello{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.hello h1{font-size:34px;line-height:1.1;color:var(--plum)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hello .chips{margin-top:8px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--lilac);color:var(--purple-dark);white-space:nowrap}
.chip.oa{background:var(--pink);color:var(--pink-text)}
.chip.coach{background:var(--plum);color:#fff}
.status{font-size:15px;color:var(--ink-2)}
.status a{color:inherit;text-decoration:none}.status b.count{color:var(--warn);text-decoration:underline}.status b.clear{color:var(--ok)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card[hidden]{display:none}
.card{scroll-margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:19px;font-weight:600;color:var(--plum)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.meta{font-size:13px;color:var(--ink-3)}
.cardlink{font-size:14px;font-weight:600;padding:11px 0;align-self:flex-start}
.note{font-size:13px;color:var(--ink-2);padding:12px 14px;border-radius:10px;background:var(--soft);overflow-wrap:anywhere}
.empty{font-size:14px;color:var(--ink-2);padding:12px 14px;border-radius:10px;background:var(--soft)}

/* Announcements */
.anns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 32px}
.ann{display:flex;flex-direction:column;gap:3px;padding:10px 0}
.ann .t{font-size:15px;font-weight:600}.ann .b{font-size:14px;color:var(--ink-2)}
.ann a{font-size:14px;font-weight:600;padding:11px 0;align-self:flex-start}

/* Next practice / next competition */
.next{flex-direction:row;gap:16px;align-items:flex-start}
.date{flex:none;width:64px;border-radius:12px;background:var(--lilac);color:var(--purple-dark);text-align:center;padding:8px 0 10px;display:flex;flex-direction:column;line-height:1.1}
.date small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.date b{font-family:var(--display);font-size:26px;font-weight:700}
.date.comp{background:var(--plum);color:#fff}
.next .body{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.next h2{font-size:20px}
.slot{display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--line-2)}
.slot .line{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px;font-weight:600}
.slot .where{font-size:13px;color:var(--ink-3)}

/* Schedule rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .when{flex:none;width:84px;white-space:nowrap;font-size:13px;font-weight:600;color:var(--purple);padding-top:1px}
.row .emo{flex:none;width:24px;font-size:18px;line-height:1.2;text-align:center}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .what{font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .more{font-size:13px;color:var(--ink-2)}
.row.big{background:var(--lilac);border-radius:12px;border-top:0;padding:12px;margin:6px 0}
.row.big + .row{border-top:0}
.row.big .when,.row.big .more{color:var(--purple-dark)}
.row.big .chip{background:#fff}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.tag.long{background:var(--warn-bg);color:var(--warn-2)}
.month{font-family:var(--display);font-size:22px;font-weight:700;color:var(--plum);margin-top:8px}
.month:first-child{margin-top:0}
.month span{font-size:14px;font-weight:500;color:var(--ink-3);margin-left:8px}

/* To-dos */
.todo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 14px;border-radius:10px;background:var(--warn-bg)}
.todo .t{font-size:15px;font-weight:600}
.todo .d{font-size:13px;color:var(--warn-2)}
.todo .late{font-weight:600;color:var(--warn)}
.todo>div{flex:1 1 180px;min-width:0}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--purple);color:#fff;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--purple-dark);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.checks{display:flex;flex-direction:column;gap:6px}.checks li{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink-2)}.checks svg{flex:none;margin-top:2px;color:var(--ok)}

/* Dues */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.tile{padding:12px 14px;border-radius:10px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;color:var(--ink-3)}
.tile b{font-family:var(--display);font-size:24px;font-weight:700;color:var(--plum)}
.tile.warn{background:var(--warn-bg)}.tile.warn span{color:var(--warn-2)}.tile.warn b{color:var(--warn)}
.tile.ok{background:var(--ok-bg)}.tile.ok span,.tile.ok b{color:var(--ok)}.tile.ok b{font-size:20px;line-height:1.3}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-3);padding:8px}
td{padding:9px 8px;border-top:1px solid var(--line-2);vertical-align:top}
th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{padding-right:0}
.r{text-align:right}
.st-paid{color:var(--ok);font-weight:600}.st-due{color:var(--warn);font-weight:600}.st-up{color:var(--ink-3)}
.lock{display:inline-flex;align-items:center;gap:6px}
.pay{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}.pay>span{flex:1 1 200px;min-width:0}
.copy{font-family:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #8F7CB3;background:#fff;color:var(--plum);cursor:pointer}

/* Links */
.linkgroups{display:flex;flex-direction:column;gap:6px}
.linkgroup{display:flex;flex-wrap:wrap;align-items:center;gap:0 24px;min-width:0}
.linkgroup h3{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);flex:none;width:104px}
.linkgroup a{display:flex;gap:8px;align-items:center;min-height:40px;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;border-radius:8px}
.linkgroup a:hover{color:var(--purple)}
.linkgroup a span{flex:none;width:22px;text-align:center;font-size:16px}

/* Page heads, filters, roster */
.pagehead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.pagehead h1{font-size:28px;color:var(--plum)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 15px;border-radius:999px;background:var(--card);border:1px solid #8F7CB3;font-family:inherit;font-size:14px;font-weight:600;color:var(--plum);cursor:pointer}
.pill:hover{border-color:var(--purple);color:var(--purple-dark)}
.pill[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input{font-family:inherit;font-size:16px;min-height:44px;width:260px;max-width:100%;padding:0 12px;border-radius:10px;border:1px solid #8F7CB3;background:#fff;color:var(--ink)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.avatar{flex:none;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;border:0;font-family:var(--display);font-size:24px;font-weight:700;background:var(--lilac);color:var(--purple-dark)}
.avatar.oa{background:var(--pink);color:var(--pink-text)}.avatar.coach{background:var(--plum);color:#fff}
.person .info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.person .nm{font-size:15px;font-weight:600}
.person a{font-size:13px;overflow-wrap:anywhere;padding:3px 0}
footer.foot{font-size:12px;color:var(--ink-3);text-align:center}

@media (max-width:760px){
  .grid2,.anns{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .hello h1{font-size:28px}
  .who{flex:1 1 100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand span{display:block;margin-left:0}
  .tabs a{padding:12px 10px}
  .row .when{width:78px;white-space:nowrap}
  .person a{padding:8px 0}
  .linkgroup h3{width:100%;margin-top:6px}
  .linkgroup a{flex:1 1 40%}
  .date{width:56px}
}
@media (max-width:360px){
  #duesCard th,#duesCard td{padding:8px 4px;font-size:13px}
}
@media (max-width:420px){
  .tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles.three .tile{padding:10px}
  .tiles.three .tile b{font-size:19px}
}
@media (prefers-reduced-motion:no-preference){.pill,.btn{transition:background-color .15s,border-color .15s,color .15s}}

/* Sign-in, loading, admin bar */
.center{max-width:440px;margin:40px auto 0;text-align:left}
.center h1{font-size:26px;color:var(--plum)}
.center form{display:flex;flex-direction:column;gap:12px}
.center input{font-family:inherit;font-size:16px;min-height:48px;padding:0 12px;border-radius:10px;border:1px solid #8F7CB3;background:#fff;color:var(--ink);width:100%}
.center label{font-size:14px;font-weight:600;color:var(--ink-2)}
button.btn{font-family:inherit;border:0;cursor:pointer;justify-content:center;min-height:44px}
.center button.btn{min-height:48px}
button.btn[disabled]{opacity:.6;cursor:default}
.err{color:#9B1C1C;font-size:14px}
.signout{font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:transparent;border:1px solid #7F5BB8;border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer;flex:none}
.whoRow{display:flex;gap:12px;align-items:center;min-width:0}
.whoRow[hidden],.tabs[hidden]{display:none}
.tabs button{font-family:inherit;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--lilac-text);font-size:15px;font-weight:500;padding:12px 14px;min-height:44px;cursor:pointer}
.tabs button[aria-current="page"]{color:#fff;font-weight:600;border-bottom-color:#C9A8FF}
.adminbtn{font-family:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #B98A3A;background:#fff;color:var(--warn-2);cursor:pointer}
.adminctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.warns{flex:1 1 100%;font-size:13px}
.warns summary{cursor:pointer;font-weight:600;padding:6px 0}
.warns li{list-style:disc;margin-left:20px;padding:2px 0}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 25%}
button.avatar{cursor:zoom-in;position:relative;overflow:hidden}
.zoom{position:fixed;inset:0;background:rgba(30,21,48,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:10}
.zoom[hidden]{display:none}
.zoomBox{position:relative;overflow:hidden;width:min(340px,86vw);aspect-ratio:1;border-radius:16px;background:#fff}
.zoomBox img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.zoom b{color:#fff;font-family:var(--display);font-size:20px}
.zoom button{font-family:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#fff;color:var(--plum);cursor:pointer}
.linkbtn{font:inherit;font-size:14px;font-weight:600;color:var(--purple);background:none;border:0;padding:11px 0;cursor:pointer;text-decoration:underline;align-self:flex-start}
.status button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
@media (max-width:640px){.tabs button{padding:12px 10px}.whoRow{flex:1 1 100%;justify-content:space-between}}

.brand{display:flex;align-items:center;gap:10px}
.brand .logo{height:44px;width:auto;flex:none;display:block}

.btlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.bt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.bt:first-child{border-top:0;padding-top:0}.bt:last-child{padding-bottom:0}
.bt .check{flex:none;width:44px;height:44px;margin:-8px -6px -8px -8px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bt .check span{width:24px;height:24px;border-radius:7px;border:2px solid #8F7CB3;background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1}
.bt .check[aria-checked="true"] span{background:var(--ok);border-color:var(--ok)}
.bt .check:hover span{border-color:var(--purple)}
.bt .bi{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.bt .what{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.bt .t{font-size:15px;font-weight:600}
.bt.done .t{font-weight:500;color:var(--ink-3);text-decoration:line-through}
.bt .more{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.tag.late{background:#FBE3E0;color:#8A1F11}
.btlist .empty{padding:4px 0;color:var(--ink-3)}
.addrow{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:12px}
.addrow .field{display:flex;flex-direction:column;gap:4px;min-width:150px}
.addrow .grow{flex:1 1 260px}
.addrow input{width:100%}
.addrow .btn{border:0;font-family:inherit;cursor:pointer}
.addrow .btn:disabled{opacity:.6}
#boardDoneWrap summary{cursor:pointer;font-weight:600;min-height:28px}
.warnnote{background:var(--warn-bg);color:var(--warn-2)}

.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
#view-board{display:flex;flex-direction:column;gap:16px}#view-board[hidden]{display:none}

.lnk{flex:none;align-self:flex-start;border:0;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--purple);min-height:32px;padding:0 6px;border-radius:8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--purple-dark)}
.lnk.danger,.pill.danger{color:#8A1F11}.pill.danger{border-color:#8A1F11}
.bedit{flex:1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;min-width:0}
.bedit .field{min-width:150px}.bedit .grow{flex:1 1 280px}.bedit .wide{flex:1 1 100%}
.bedit input{width:100%}
.bedit .bbtns{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bedit .btn{border:0;font-family:inherit;cursor:pointer}
.bedit .lnk{margin-left:auto;align-self:center}
.bt.editing{background:var(--soft);border-radius:12px;padding:14px;border-top:0}
</style>
</head>
<body>

  function md(s){ var x = d(s); return MON[x.getMonth()] + ' ' + x.getDate(); }
  function wmd(s){ var x = d(s); return DOW[x.getDay()] + ' ' + MON[x.getMonth()] + ' ' + x.getDate(); }
  function range(e){
    if(!e.end) return wmd(e.start);

  var CHECK = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function teamChip(team){ return '<span class="chip' + (team === 'Open Adult' ? ' oa' : '') + '">' + esc(team) + '</span>'; }

  function emoji(e){
    var t = e.title || '';
    if(e.type === 'Competition') return '🏆';
    if(/holiday/i.test(t)) return '🎄';
    if(/psycher/i.test(t)) return '🎁';
    if(/celebration/i.test(t)) return '🎉';
    if(/family/i.test(t)) return '💜';

    if(e.type === 'Team') return '✨';
    return '⛸️';
  }
  function linkEmoji(l){
    var t = l.label.toLowerCase();
    return /video/.test(t) ? '🎬' : /calendar/.test(t) ? '📅' : /folder/.test(t) ? '📁' : /step/.test(t) ? '⛸️' : /plan/.test(t) ? '📝' : /bssc|nesso|eastern|schedule/.test(t) ? '🏆' : /slack/.test(t) ? '💬' : /partiful|social/.test(t) ? '🥂' : /website/.test(t) ? '🌐' : '🔗';
  }
  function splitTitle(t){ var m = /^(.*?)\s*\((longer)\)$/i.exec(t); return m ? {title: m[1], longer: true} : {title: t, longer: false}; }
  function schedRow(e){
    var st = splitTitle(e.title);
    var title = e.url ? '<a href="' + esc(safeUrl(e.url)) + '"' + EXT + '>' + esc(st.title) + '</a>' : esc(st.title);

    return '<div class="row' + (e.type === 'Competition' ? ' big' : '') + '"><span class="when">' + esc(range(e)) + '</span><span class="emo" aria-hidden="true">' + emoji(e) + '</span><span class="txt"><span class="what">' + title + chip + (st.longer ? '<span class="tag long">Longer</span>' : '') + '</span><span class="more">' + esc(e.details || '') + (e.location ? ' · ' + esc(e.location) : '') + '</span></span></div>';
  }

  // ---------- talking to the server ----------
  var KEY = 'tt_session', token = '';
  try { token = localStorage.getItem(KEY) || ''; } catch(e){}
  function call(name, args){
    return new Promise(function(resolve, reject){
      if(window.MOCK) return setTimeout(function(){ resolve(window.MOCK(name, args)); }, 50);
      if(BOOT.api){
        fetch(BOOT.api + '?api=' + encodeURIComponent(name) + '&args=' + encodeURIComponent(JSON.stringify(args)), {credentials: 'omit', redirect: 'follow'})
          .then(function(r){ return r.json(); })
          .then(function(o){ if(o && o.ok) resolve(o.result); else reject(new Error((o && o.error) || 'Request failed')); }, reject);
        return;
      }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(name, args);
    });
  }
  var firstLoad = true;
  var D = null, viewAs = '', tab = 'home', schedType = 'All', rosterTeam = 'All', photos = null;

  function show(which){
    ['auth','home','schedule','roster','board'].forEach(function(t){ $('view-' + t).hidden = t !== which; });
    var signedIn = which !== 'auth';
    $('tabs').hidden = !signedIn; $('whoRow').hidden = !signedIn;
    if(!signedIn) $('adminBar').hidden = true;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){ if(b.getAttribute('data-tab') === which) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  }
  function go(t, anchor){
    tab = t; show(t);
    var el = anchor && $(anchor);
    if(el) el.scrollIntoView(); else window.scrollTo(0, 0);
  }
  $('tabs').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if(b) go(b.getAttribute('data-tab')); });
  document.addEventListener('click', function(ev){
    var g = ev.target.closest('[data-go]');
    if(g){ ev.preventDefault(); var p = g.getAttribute('data-go').split('#'); go(p[0], p[1]); }
  });

  function signInForm(msg){
    $('authCard').innerHTML = '<h1>Sign in</h1><p class="meta">Enter the email address the team has for you. We’ll send you a link that signs you in.</p>' +
      (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
      '<form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><button class="btn" type="submit" id="send">Email me a sign-in link</button></form>';
    $('loginForm').addEventListener('submit', function(ev){
      ev.preventDefault();
      var em = $('email').value.trim(); if(!em) return;
      $('send').disabled = true; $('send').textContent = 'Sending…';
      call('requestLink', [em]).then(function(){
        $('authCard').innerHTML = '<h1>Check your email</h1><p>If <b>' + esc(em) + '</b> is on the team list, a sign-in link is on its way. It works once and expires in 15 minutes.</p><p class="meta">Nothing after a few minutes? Check spam, or try the other email address you use for the team.</p><button type="button" class="linkbtn" id="again">Use a different email</button>';
        $('again').addEventListener('click', function(){ signInForm(''); });
      }, function(){ signInForm('That didn’t work. Please try again in a minute.'); });
    });
    show('auth');
  }
  function fail(){ $('authCard').innerHTML = '<h1>Something went wrong</h1><p>The dashboard couldn’t load. Please reload the page. If it keeps happening, email the board.</p>'; show('auth'); }

  // The last page this person saw is kept on their own device so the next visit appears at once,
  // then is replaced by fresh data a moment later. It is removed on sign-out.
  var LAST = 'tt_last';
  function keep(res){ try { localStorage.setItem(LAST, JSON.stringify({ k: token.slice(0, 16), d: res })); } catch(e){} }
  function kept(){ try { var o = JSON.parse(localStorage.getItem(LAST) || 'null'); return o && o.k === token.slice(0, 16) && o.d && o.d.auth ? o.d : null; } catch(e){ return null; } }
  function getPhotos(){ if(photos === null){ photos = {}; call('getPhotos', [token]).then(function(p){ photos = p || {}; drawRoster(); }, function(){ }); } }
  function load(refresh){
    return call('getDashboard', [token, viewAs, !!refresh]).then(function(res){
      if(!res || !res.auth){ token = ''; D = null; try { localStorage.removeItem(KEY); localStorage.removeItem(LAST); } catch(e){} signInForm(''); return; }
      if(refresh){ photos = null; big = {}; } // photos and their crops change together, so reload both
      D = res;
      if(!viewAs) keep(res);
      if(firstLoad){ firstLoad = false; if(D.board) tab = 'board'; } // board members land on the Board page
      if(tab === 'board' && !D.board) tab = 'home'; render(); show(tab);
      getPhotos();
    }, function(){ if(!D) fail(); }); // if a saved copy is already on screen, keep showing it
  }
  $('signOut').addEventListener('click', function(){
    var t = token; token = ''; D = null; viewAs = ''; photos = null; firstLoad = true; tab = 'home';
    try { localStorage.removeItem(KEY); localStorage.removeItem(LAST); } catch(e){}
    call('signOut', [t]).then(function(){}, function(){});
    signInForm('');
  });
  $('viewAs').addEventListener('change', function(){ viewAs = $('viewAs').value; $('adminText').textContent = 'Loading…'; load(false); });
  $('refresh').addEventListener('click', function(){ $('refresh').disabled = true; $('refresh').textContent = 'Refreshing…'; load(true).then(function(){ $('refresh').disabled = false; $('refresh').textContent = 'Refresh data'; }); });

        same.map(function(e){ return '<div class="slot"><div class="line">' + (e.team !== 'Both' ? teamChip(e.team) : '') + '<span>' + esc(e.details || '') + '</span></div><span class="where">' + esc(e.location || '') + '</span></div>'; }).join('') + '</div></div>';

    if(comp){

        '<p class="meta">' + esc(range(comp)) + (comp.location ? ' · ' + esc(comp.location) : '') + '</p><p>' + esc(comp.details || '') + '</p>' + room +
        (comp.url ? '<a class="cardlink" href="' + esc(safeUrl(comp.url)) + '"' + EXT + '>Team schedule, hotel and packing list</a>' : '') + '</div></div>';

  }
  $('schedFilters').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if(b){ schedType = b.getAttribute('data-type'); drawSchedule(); } });

  // ---------- Board tab (board members only; the server sends D.board to no one else) ----------
  var boardBusy = false, boardEdit = '', boardAsk = false;
  function drawBoard(){
    var has = !!(D && D.board);
    $('tabBoard').hidden = !has;
    if(!has) return;
    var today = D.asOf, all = D.board.slice();
    var byDue = function(x, y){ return (x.due || '9999') < (y.due || '9999') ? -1 : (x.due || '9999') > (y.due || '9999') ? 1 : 0; };
    var open = all.filter(function(t){ return !t.done; }).sort(byDue);
    var done = all.filter(function(t){ return t.done; }).sort(function(x, y){ return (y.doneOn || '') < (x.doneOn || '') ? -1 : 1; });
    var late = open.filter(function(t){ return t.due && t.due < today; }).length;
    $('boardCount').textContent = open.length + ' open' + (late ? ' · ' + late + ' past due' : '') + ' · ' + done.length + ' done · only board members can see this page';
    var M = D.money, mh = '';
    if(M){
      var T = M.totals, behind = M.rows.filter(function(r){ return r.overdue > 0; }), gearOnly = M.rows.filter(function(r){ return !r.overdue && r.gear > 0; }), credit = M.rows.filter(function(r){ return r.credit > 0; });
      mh = '<div class="head"><h2>Dues at a glance</h2><span class="meta">From the Dues Tracker · ' + M.people + ' people</span></div>' +
        '<div class="tiles four"><div class="tile ' + (T.behind ? 'warn' : 'ok') + '"><span>Behind on dues</span><b class="num">' + T.behind + (T.behind === 1 ? ' person' : ' people') + '</b></div>' +
        '<div class="tile' + (T.overdue ? ' warn' : '') + '"><span>Total overdue</span><b class="num">' + money(T.overdue) + '</b></div>' +
        '<div class="tile' + (T.gear ? ' warn' : '') + '"><span>Gear and fees owed</span><b class="num">' + money(T.gear) + '</b></div>' +
        '<div class="tile"><span>Dues still to come in</span><b class="num">' + money(T.left) + '</b></div></div>';
      if(behind.length || gearOnly.length){
        mh += '<div class="scroll"><table><thead><tr><th>Who</th><th class="r">Overdue</th><th>Since</th><th class="r">Gear owed</th><th class="r">Left this season</th><th>Next payment</th></tr></thead><tbody>' +
          behind.concat(gearOnly).map(function(r){
            return '<tr><td>' + esc(r.name) + '</td><td class="r num ' + (r.overdue ? 'st-due' : '') + '">' + (r.overdue ? money(r.overdue) : '—') + '</td><td style="white-space:nowrap">' + (r.since ? esc(md(r.since)) : '—') + '</td><td class="r num">' + (r.gear ? money(r.gear) : '—') + '</td><td class="r num">' + (r.left ? money(r.left) : '—') + '</td><td style="white-space:nowrap">' + (r.next ? money(r.next.amount) + ' on ' + esc(md(r.next.due)) : '—') + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      } else mh += '<p class="note">Everyone is up to date on dues and gear.</p>';
      if(credit.length) mh += '<p class="meta">Paid ahead or overpaid: ' + credit.map(function(r){ return esc(r.name) + ' (' + money(r.credit) + ')'; }).join(', ') + '</p>';
    }
    $('boardMoney').innerHTML = mh; $('boardMoney').hidden = !mh;
    var L = D.logins, lh = '';
    if(L){
      var when = function(s){ var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(s || ''); if(!m) return '—'; var h = +m[4]; return MON[+m[2] - 1] + ' ' + (+m[3]) + ', ' + ((h % 12) || 12) + ':' + m[5] + (h < 12 ? ' AM' : ' PM'); };
      var seen = L.filter(function(p){ return p.visits > 0; }).sort(function(x, y){ return x.lastVisit < y.lastVisit ? 1 : x.lastVisit > y.lastVisit ? -1 : 0; });
      var never = L.filter(function(p){ return !p.visits; }).map(function(p){ return p.name; }).sort();
      lh = '<div class="head"><h2>Who’s using the dashboard</h2><span class="meta">' + seen.length + ' of ' + L.length + ' have visited</span></div>';
      if(seen.length) lh += '<div class="scroll"><table><thead><tr><th>Who</th><th class="r">Visits</th><th>Last visit</th><th class="r">Sign-ins</th><th>Last sign-in</th></tr></thead><tbody>' +
        seen.map(function(p){ return '<tr><td>' + esc(p.name) + '</td><td class="r num">' + p.visits + '</td><td style="white-space:nowrap">' + esc(when(p.lastVisit)) + '</td><td class="r num">' + p.signins + '</td><td style="white-space:nowrap">' + esc(when(p.lastSignin)) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      if(never.length) lh += '<p class="meta">Not visited yet (' + never.length + '): ' + never.map(esc).join(', ') + '</p>';
      lh += '<p class="meta">A visit is counted at most once per half hour. A sign-in is clicking an emailed link, which lasts 30 days, so visits are the better measure.</p>';
    }
    $('boardLogins').innerHTML = lh; $('boardLogins').hidden = !lh;
    function item(t){
      var days = t.due ? Math.round((d(t.due) - d(today)) / 86400000) : null;
      var due = t.due ? '<span class="tag' + (!t.done && days < 0 ? ' late' : !t.done && days <= 7 ? ' long' : '') + '">' + (t.done ? 'Was due ' : days < 0 ? 'Past due · ' : 'Due ') + esc(wmd(t.due)) + (!t.done && days >= 0 ? ' · ' + rel(days) : '') + '</span>' : '';
      var who = t.owner ? '<span class="chip">' + esc(t.owner) + '</span>' : '';
      var sub = [t.notes ? esc(t.notes) : '', t.source ? 'From: ' + esc(t.source) : '', t.done && t.doneBy ? 'Done by ' + esc(t.doneBy) + (t.doneOn ? ' on ' + esc(md(t.doneOn)) : '') : ''].filter(Boolean).join(' · ');
      if(boardEdit === t.id){
        return '<li class="bt editing"><form class="bedit" data-form="' + esc(t.id) + '"><div class="field grow"><label for="beTask">To-do</label><input id="beTask" type="text" maxlength="200" value="' + esc(t.task) + '"></div>' +
          '<div class="field"><label for="beDue">Due</label><input id="beDue" type="date" value="' + esc(t.due || '') + '"></div>' +
          '<div class="field"><label for="beOwner">Who</label><input id="beOwner" type="text" maxlength="60" value="' + esc(t.owner || '') + '"></div>' +
          '<div class="field wide"><label for="beNotes">Notes</label><input id="beNotes" type="text" maxlength="500" value="' + esc(t.notes || '') + '"></div>' +
          '<div class="bbtns">' + (boardAsk ? '<span class="meta">Remove this to-do for the whole board?</span><button type="button" class="pill danger" data-act="remove-yes">Yes, remove</button><button type="button" class="pill" data-act="remove-no">Keep it</button>'
            : '<button type="submit" class="btn">Save</button><button type="button" class="pill" data-act="cancel">Cancel</button><button type="button" class="lnk danger" data-act="remove">Remove</button>') + '</div></form></li>';
      }
      var edit = '<button type="button" class="lnk" data-act="edit" data-id="' + esc(t.id) + '" aria-label="Edit: ' + esc(t.task) + '">Edit</button>';
      return '<li class="bt' + (t.done ? ' done' : '') + '"><button type="button" class="check" role="checkbox" aria-checked="' + (t.done ? 'true' : 'false') + '" data-id="' + esc(t.id) + '" aria-label="' + (t.done ? 'Mark as not done: ' : 'Mark as done: ') + esc(t.task) + '"><span aria-hidden="true">' + (t.done ? '✓' : '') + '</span></button><div class="bi"><span class="what"><span class="t">' + esc(t.task) + '</span>' + due + who + '</span>' + (sub ? '<span class="more">' + sub + '</span>' : '') + '</div>' + edit + '</li>';
    }
    $('boardOpen').innerHTML = open.length ? open.map(item).join('') : '<li class="empty">Nothing open. 🎉</li>';
    $('boardDoneWrap').hidden = !done.length;
    $('boardDoneSum').textContent = 'Done (' + done.length + ')';
    $('boardDone').innerHTML = done.map(item).join('');
  }
  function boardSay(msg){ $('boardMsg').textContent = msg || ''; $('boardMsg').hidden = !msg; }
  function boardCall(name, args, after){
    if(boardBusy) return; boardBusy = true; boardSay('');
    call(name, [token].concat(args)).then(function(list){ boardBusy = false; if(list && list.length != null){ D.board = list; } drawBoard(); if(after) after(); },
      function(err){ boardBusy = false; drawBoard(); boardSay((err && err.message) || 'That didn’t save. Please try again.'); });
  }
  $('view-board').addEventListener('click', function(ev){
    var act = ev.target.closest('[data-act]');
    if(act && !boardBusy && D && D.board){
      var what = act.getAttribute('data-act');
      if(what === 'edit'){ boardEdit = act.getAttribute('data-id'); boardAsk = false; boardSay(''); drawBoard(); var f = $('beTask'); if(f) f.focus(); }
      else if(what === 'cancel'){ boardEdit = ''; boardAsk = false; drawBoard(); }
      else if(what === 'remove'){ boardAsk = true; drawBoard(); }
      else if(what === 'remove-no'){ boardAsk = false; drawBoard(); }
      else if(what === 'remove-yes'){ var rid = boardEdit; boardEdit = ''; boardAsk = false; D.board = D.board.filter(function(t){ return t.id !== rid; }); drawBoard(); boardCall('removeBoardTodo', [rid]); }
      return;
    }
    var b = ev.target.closest('button.check'); if(!b || boardBusy || !D || !D.board) return;
    var id = b.getAttribute('data-id'), to = b.getAttribute('aria-checked') !== 'true';
    D.board.forEach(function(t){ if(t.id === id){ t.done = to; if(to){ t.doneBy = D.viewer.name; t.doneOn = D.asOf; } } });
    drawBoard(); // show it straight away; the server's copy replaces it when the save finishes
    boardCall('setBoardDone', [id, to]);
  });
  $('view-board').addEventListener('submit', function(ev){
    var f = ev.target.closest('form.bedit'); if(!f) return;
    ev.preventDefault();
    var id = f.getAttribute('data-form'), task = $('beTask').value.trim(), due = $('beDue').value, owner = $('beOwner').value.trim(), notes = $('beNotes').value.trim();
    if(!task){ boardSay('The to-do needs some text.'); return; }
    D.board.forEach(function(t){ if(t.id === id){ t.task = task; t.due = due; t.owner = owner; t.notes = notes; } });
    boardEdit = ''; boardAsk = false; drawBoard();
    boardCall('editBoardTodo', [id, task, due, owner, notes]);
  });
  $('boardAdd').addEventListener('submit', function(ev){
    ev.preventDefault();
    var t = $('boardTask').value.trim(); if(!t){ boardSay('Type what needs doing first.'); return; }
    $('boardAddBtn').disabled = true;
    boardCall('addBoardTodo', [t, $('boardDue').value, $('boardOwner').value.trim()], function(){ $('boardTask').value = ''; $('boardDue').value = ''; $('boardOwner').value = ''; });
    setTimeout(function(){ $('boardAddBtn').disabled = false; }, 1500);
  });

  $('rosterFilters').innerHTML = [['All','Everyone'],['Adult','Adult'],['Open Adult','Open Adult'],['Coach','Coaches']].map(function(o){ return '<button type="button" class="pill" data-team="' + o[0] + '">' + o[1] + '</button>'; }).join('');
  function drawRoster(){
    if(!D) return;
    press($('rosterFilters'), 'data-team', rosterTeam);
    var q = $('rosterSearch').value.trim().toLowerCase();
    var list = D.roster.filter(function(p){
      if(q && p.name.toLowerCase().indexOf(q) < 0) return false;
      if(rosterTeam === 'Adult') return !!p.adult;
      if(rosterTeam === 'Open Adult') return !!p.oa;
      if(rosterTeam === 'Coach') return p.adult === 'Coach' || p.oa === 'Coach';
      return true;
    });
    $('rosterBody').innerHTML = list.map(function(p){
      var parts = p.name.split(' '), ini = (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      var cls = p.adult === 'Coach' ? ' coach' : (!p.adult && p.oa ? ' oa' : '');
      var has = photos && photos[p.name];
      var av = has ? '<button type="button" class="avatar' + cls + '" data-photo="' + esc(p.name) + '" aria-label="Enlarge photo of ' + esc(p.name) + '"><img alt=""' + (p.focus ? ' data-focus="' + p.focus.join(' ') + '"' : '') + ' src="' + esc(photos[p.name]) + '"></button>' : '<div class="avatar' + cls + '" aria-hidden="true">' + esc(ini) + '</div>';
      var tel = p.phone ? '<a class="num" href="tel:+1' + p.phone.replace(/\D/g, '') + '"' + EXT + '>' + esc(p.phone) + '</a>' : '';
      return '<li class="person">' + av + '<div class="info"><span class="nm">' + esc(p.name) + '</span><div class="chips">' + teamChips(p.adult, p.oa) + '</div>' + tel + (p.email ? '<a href="mailto:' + esc(p.email) + '"' + EXT + '>' + esc(p.email).replace('@', '<wbr>@') + '</a>' : '') + '</div></li>';
    }).join('');
    Array.prototype.forEach.call($('rosterBody').querySelectorAll('img[data-focus]'), focusImg);
    $('rosterEmpty').hidden = list.length > 0;
    $('rosterCount').textContent = list.length + (list.length === 1 ? ' person' : ' people') + ' · visible to signed-in team members only';
  }
  $('rosterFilters').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if(b){ rosterTeam = b.getAttribute('data-team'); drawRoster(); } });
  $('rosterSearch').addEventListener('input', drawRoster);
  // Shows only the part of a photo around the person's face: "x y width" as fractions of the picture.
  function focusImg(img){
    var f = (img.getAttribute('data-focus') || '').split(' ').map(Number);
    function place(){
      var W = img.naturalWidth, H = img.naturalHeight; if(!W || !H || f.length !== 3) return;
      var w = 100 / f[2], h = w * H / W;
      if(h < 100){ w = w * 100 / h; h = 100; }
      if(w < 100){ h = h * 100 / w; w = 100; }
      var l = Math.min(0, Math.max(100 - w, 50 - f[0] * w)), t = Math.min(0, Math.max(100 - h, 50 - f[1] * h));
      img.style.cssText = 'position:absolute;max-width:none;border-radius:0;width:' + w + '%;height:' + h + '%;left:' + l + '%;top:' + t + '%';
    }
    img.onload = place; if(img.complete && img.naturalWidth) place();
  }
  var zoomFrom = null, big = {};
  function closeZoom(){ $('zoom').hidden = true; if(zoomFrom && document.contains(zoomFrom)) zoomFrom.focus(); zoomFrom = null; }
  $('rosterBody').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-photo]'); if(!b || !photos) return;
    var n = b.getAttribute('data-photo'); if(!photos[n]) return;
    zoomFrom = b; var zi = $('zoomImg'), src = b.querySelector('img'), fo = src && src.getAttribute('data-focus');
    // The enlarged view shows a wider crop than the small circle, and loads a sharper copy of the photo.
    if(fo){ var f = fo.split(' ').map(Number); fo = [f[0], f[1], Math.min(1, f[2] * 1.5)].join(' '); }
    zi.onload = null; zi.style.cssText = ''; zi.removeAttribute('data-focus'); zi.src = photos[n];
    if(fo){ zi.setAttribute('data-focus', fo); focusImg(zi); }
    if(!big[n]) big[n] = call('getPhoto', [token, n]);
    big[n].then(function(u){ if(u && zoomFrom === b && !$('zoom').hidden) zi.src = u; }, function(){ delete big[n]; });
    $('zoomName').textContent = n; $('zoom').hidden = false; $('zoomClose').focus();
  });
  $('zoom').addEventListener('click', closeZoom);
  document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape' && !$('zoom').hidden) closeZoom(); });

  // ---------- start ----------
  if(BOOT && BOOT.code){
    try { if(BOOT.api) history.replaceState(null, '', location.pathname); } catch(e){}
    call('redeem', [BOOT.code]).then(function(r){
      if(r && r.ok){ token = r.token; try { localStorage.setItem(KEY, token); } catch(e){} load(false); }
      else if(token) load(false);
      else signInForm('That sign-in link has expired or was already used. Enter your email for a new one.');
    }, fail);
  } else if(token){
    var was = kept();
    if(was){ D = was; firstLoad = false; if(D.board) tab = 'board'; try { render(); show(tab); getPhotos(); } catch(e){ D = null; firstLoad = true; tab = 'home'; } }
    load(false);
  }
  else signInForm('');
})();

</script>
</body>
</html>
